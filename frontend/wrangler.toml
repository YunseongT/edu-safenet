# Cloudflare Workers(정적 에셋) 배포 설정.
# `npx wrangler deploy`가 ./dist를 정적 사이트로 업로드한다(별도 Worker 스크립트 불필요).
name = "edu-safenet"
compatibility_date = "2026-05-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# 커스텀 도메인(두 존 다 동일 CF 계정) — wrangler가 DNS·인증서 자동 생성.
# 대시보드 수동 추가는 deploy가 덮어쓰므로 여기 명시해야 병행 유지됨.
[[routes]]
pattern = "safenet.aieduflare.com"
custom_domain = true

[[routes]]
pattern = "safenet.yunseongt.com"
custom_domain = true

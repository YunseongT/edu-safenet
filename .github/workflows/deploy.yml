name: Deploy to Cloudflare

# master 푸시 시 프런트 빌드 후 Cloudflare Workers(정적 에셋)로 배포.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          # 공개 URL(비밀 아님). 터널 백엔드 호출용.
          VITE_API_BASE: https://api.yunseongt.com
          # 도메인잠금 키(번들에 내장돼 어차피 공개). repo Secret으로 주입.
          VITE_VWORLD_KEY: ${{ secrets.VITE_VWORLD_KEY }}
        run: npm run build

      - name: Deploy (wrangler)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

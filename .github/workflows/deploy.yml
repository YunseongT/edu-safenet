name: Deploy to Cloudflare

# master 푸시 시 프런트 빌드 후 Cloudflare Workers(정적 에셋)로 배포.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Parity test (py↔js 엔진 드리프트)
        working-directory: ${{ github.workspace }}
        run: node tests/parity.mjs

      - name: Build
        env:
          # VITE_API_BASE 미지정 → 런타임에 호스트(aieduflare/yunseongt)별 백엔드 자동선택(api.js hostBackend).
          # 도메인잠금 키(번들에 내장돼 어차피 공개). repo Secret으로 주입.
          VITE_VWORLD_KEY: ${{ secrets.VITE_VWORLD_KEY }}
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
